buildscript {
    ext {
        spek_version = '2.0.7'
        mockk_version = '1.9.3'
        kotlinVersion = '2.0.21'
        daggerVersion = '2.51'
        gsonVersion = '2.8.7'
        // Matches what the app's dependency graph already resolves to, so the declared and the
        // effective version stop drifting apart.
        coroutinesVersion = '1.8.1'
    }
}
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'de.mannodermaus.android-junit5'
    id 'jacoco'
    id 'maven-publish'
}
ext {
    supportLibraryVersion = '27.1.1'
    targetSdkVersion = 36
    minSdkVersion = 21
}

android {
    namespace = "com.ndmsystems.coala"
    compileSdk = 36
    defaultConfig {
        multiDexEnabled true
        minSdkVersion project.ext.minSdkVersion
        targetSdkVersion project.ext.targetSdkVersion
        versionCode 1
        versionName "0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.all {
            jacoco {
                // Kotlin inline/lambda classes carry no source location; without this they are
                // dropped from the report and coverage reads lower than it is.
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
        junitPlatform {
            unitTests.all {
                testLogging.events = ["passed", "skipped", "failed"]
                // RBGHelper builds a fresh SHA1PRNG per call, so every key generation reseeds from
                // securerandom.source, which defaults to the blocking /dev/random. On CI agents with a
                // drained entropy pool that read can stall past Spek's 10s per-test timeout.
                jvmArgs '-Djava.net.preferIPv4Stack=true', '-Djava.security.egd=file:/dev/./urandom'
            }

            filters {
                engines {
                    include 'spek2','junit-vintage'
                }
            }
            jacocoOptions {
                // here goes all jacoco config, for example
                html.enabled = true
                xml.enabled = false
                csv.enabled = false
            }
        }

    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Formerly a local jar in app/libs; the Central artifact is byte-identical (same sha1).
    // A file dependency neither ends up in the published AAR nor in its POM, so consumers of
    // the artifact would be missing these classes at runtime (CoAPMessagePool uses them).
    implementation 'com.googlecode.concurrentlinkedhashmap:concurrentlinkedhashmap-lru:1.4'

    implementation "com.google.dagger:dagger:$daggerVersion"
    ksp "com.google.dagger:dagger-compiler:$daggerVersion"

    implementation 'com.squareup.okhttp3:okhttp:4.5.0'
    implementation "com.google.code.gson:gson:$gsonVersion"
    implementation 'net.jodah:expiringmap:0.5.8'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"

    implementation 'org.apache.commons:commons-collections4:4.0'

    //unit tests
    testImplementation 'org.mockito:mockito-core:2.8.9'
    testImplementation "org.junit.vintage:junit-vintage-engine:5.5.1"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.5.1"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:5.5.1"

    testImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlinVersion"
    testImplementation "org.spekframework.spek2:spek-dsl-jvm:$spek_version"
    testImplementation "org.spekframework.spek2:spek-runner-junit5:$spek_version"
    testImplementation "io.mockk:mockk:$mockk_version"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutinesVersion"
    // android.jar ships org.json as throwing stubs, so ResponseErrorFactory's payload parsing is
    // unreachable in unit tests without the real thing. Same reason the app module pulls it in.
    testImplementation 'org.json:json:20180813'

}

jacoco {
    toolVersion = '0.8.12'
}

/**
 * Coverage for the unit-test suite: ./gradlew :submodules:coala:app:coverageReport
 * HTML lands in app/build/reports/jacoco/coverageReport/html/index.html
 */
tasks.register('coverageReport', JacocoReport) {
    group = 'verification'
    description = 'Generates a JaCoCo coverage report for the debug unit tests.'
    dependsOn 'testDebugUnitTest'

    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }

    // Generated code says nothing about how well the transport is tested.
    def generated = [
            '**/di/Dagger*',
            '**/*_Factory*',
            '**/*_MembersInjector*',
            '**/BuildConfig.*',
            '**/R.class',
            '**/R$*.class',
    ]
    classDirectories.setFrom(
            fileTree(dir: layout.buildDirectory.dir('tmp/kotlin-classes/debug').get().asFile, excludes: generated)
    )
    sourceDirectories.setFrom(files("$projectDir/src/main/java"))
    executionData.setFrom(fileTree(dir: layout.buildDirectory.get().asFile, includes: ['**/*.exec']))
}

/**
 * Publication of the single :app module as an Android library artifact.
 *
 * Local check: ./gradlew :app:publishToMavenLocal
 * JitPack builds the same publication on demand and serves it as
 * com.github.coalalib:coalajava:<commit-or-tag>, rewriting the version below
 * to the requested ref. See jitpack.yml for the JDK it builds with.
 */
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.coalalib'
                artifactId = 'coalajava'
                version = android.defaultConfig.versionName
            }
        }
    }
}
